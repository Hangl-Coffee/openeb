name: Build metavision_viewer (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    name: Windows x64 Release
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Long paths
        shell: bash
        run: git config --system core.longpaths true

      - name: Get vcpkg (current tool, dependency versions pinned by OpenEB manifest)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git /c/v
          cp utils/windows/11/vcpkg-openeb.json /c/v/vcpkg.json
          echo "VCPKG_ROOT_DIR=C:/v" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: C:\vcache
          key: vcpkg-bincache-${{ hashFiles('utils/windows/11/vcpkg-openeb.json') }}
          restore-keys: |
            vcpkg-bincache-

      - name: Install dependencies with vcpkg
        shell: cmd
        env:
          VCPKG_DEFAULT_BINARY_CACHE: C:\vcache
        run: |
          if not exist C:\vcache mkdir C:\vcache
          cd /d C:\v
          call bootstrap-vcpkg.bat -disableMetrics
          vcpkg.exe install --triplet x64-windows --x-install-root installed

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: C:\vcache
          key: vcpkg-bincache-${{ hashFiles('utils/windows/11/vcpkg-openeb.json') }}-${{ github.run_id }}

      - name: Configure
        shell: bash
        run: |
          VCPKG_DIR="C:/v"
          cmake -S . -B build -A x64 \
            -DCMAKE_TOOLCHAIN_FILE="cmake/toolchains/vcpkg.cmake" \
            -DVCPKG_DIRECTORY="$VCPKG_DIR" \
            -DBUILD_TESTING=OFF \
            -DCOMPILE_PYTHON3_BINDINGS=OFF

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Install and bundle
        shell: bash
        run: |
          cmake --install build --config Release --prefix dist
          # runtime DLLs from vcpkg (OpenCV, Boost, GLEW, GLFW, HDF5, protobuf, libusb, ...)
          cp "/c/v/installed"/x64-windows/bin/*.dll dist/bin/ || true
          # launcher that points the HAL to the bundled plugins
          cat > dist/metavision_viewer.bat <<'EOF'
          @echo off
          set "ROOT=%~dp0"
          set "PATH=%ROOT%bin;%PATH%"
          set "MV_HAL_PLUGIN_PATH=%ROOT%lib\metavision\hal\plugins"
          "%ROOT%bin\metavision_viewer.exe" %*
          EOF
          echo "---- dist tree ----"
          find dist -maxdepth 4 -not -path "*/include/*" | sort | head -150

      - name: Build player library (mv_player.dll) and selftest
        shell: bash
        run: |
          ROOT="$(pwd -W)"
          cmake -S utils/mv_raw_player/native -B build_player -A x64 \
            -DCMAKE_TOOLCHAIN_FILE="$ROOT/cmake/toolchains/vcpkg.cmake" \
            -DVCPKG_DIRECTORY="C:/v" \
            -DCMAKE_PREFIX_PATH="$ROOT/dist"
          cmake --build build_player --config Release
          cp build_player/Release/mv_player.dll dist/bin/
          cp build_player/Release/mvp_selftest.exe dist/bin/

      - name: Selftest (generate a RAW file and play it headless)
        shell: bash
        run: |
          python utils/mv_raw_player/tools/gen_raw.py test.raw 6
          python utils/mv_raw_player/tools/gen_vib.py vib.raw 4
          PLUG="$(find dist -iname '*hal_plugin*.dll' | head -1)"
          echo "plugin dll: $PLUG"
          test -n "$PLUG"
          export MV_HAL_PLUGIN_PATH="$(cd "$(dirname "$PLUG")" && pwd -W)"
          export PATH="$(pwd):$(pwd)/dist/bin:$PATH"
          ./dist/bin/mvp_selftest.exe test.raw vib.raw
          cp vib.raw dist/sample_vibration_40Hz_50Hz.raw

      - name: Build WinForms app (MvRawPlayer.exe)
        shell: bash
        run: |
          dotnet build utils/mv_raw_player/app/MvRawPlayer.csproj -c Release -o dist/bin
          printf '@echo off\r\nstart "" "%%~dp0bin\\MvRawPlayer.exe" %%*\r\n' > dist/MvRawPlayer.bat
          cat dist/MvRawPlayer.bat

      - name: Package
        shell: bash
        run: |
          rm -rf dist/include dist/share/cmake
          7z a -tzip mv_raw_player_win64.zip ./dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mv_raw_player_win64
          path: mv_raw_player_win64.zip
