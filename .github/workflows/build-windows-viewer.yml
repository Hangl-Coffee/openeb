name: Build metavision_viewer (Windows)

on:
  workflow_dispatch:

env:
  VCPKG_EXPORT_URL: "https://prophesee-bamboo.s3.eu-west-1.amazonaws.com/build-env/vcpkg-export-win11-20260112-MV_V5.2.0.zip"

jobs:
  build:
    name: Windows x64 Release
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Long paths
        shell: bash
        run: git config --system core.longpaths true

      - name: Fetch prebuilt vcpkg dependencies (published by Prophesee)
        shell: bash
        run: |
          curl -fL --retry 3 -o vcpkg-export.zip "$VCPKG_EXPORT_URL"
          mkdir -p "$RUNNER_TEMP/export"
          7z x -y -o"$RUNNER_TEMP/export" vcpkg-export.zip > /dev/null
          TC="$(find "$RUNNER_TEMP/export" -path '*scripts/buildsystems/vcpkg.cmake' | head -1)"
          test -n "$TC" || { echo "vcpkg toolchain not found in export"; find "$RUNNER_TEMP/export" -maxdepth 2; exit 1; }
          VCPKG_ROOT_DIR="$(dirname "$(dirname "$(dirname "$TC")")")"
          echo "VCPKG_ROOT_DIR=$VCPKG_ROOT_DIR" >> "$GITHUB_ENV"
          echo "vcpkg root: $VCPKG_ROOT_DIR"
          ls "$VCPKG_ROOT_DIR/installed"

      - name: Configure
        shell: bash
        run: |
          VCPKG_DIR="$(cygpath -m "$VCPKG_ROOT_DIR")"
          cmake -S . -B build -A x64 \
            -DCMAKE_TOOLCHAIN_FILE="cmake/toolchains/vcpkg.cmake" \
            -DVCPKG_DIRECTORY="$VCPKG_DIR" \
            -DBUILD_TESTING=OFF \
            -DCOMPILE_PYTHON3_BINDINGS=OFF

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Install and bundle
        shell: bash
        run: |
          cmake --install build --config Release --prefix dist
          # runtime DLLs from vcpkg (OpenCV, Boost, GLEW, GLFW, HDF5, protobuf, libusb, ...)
          cp "$VCPKG_ROOT_DIR"/installed/x64-windows/bin/*.dll dist/bin/ || true
          # launcher that points the HAL to the bundled plugins
          cat > dist/metavision_viewer.bat <<'EOF'
          @echo off
          set "ROOT=%~dp0"
          set "PATH=%ROOT%bin;%PATH%"
          set "MV_HAL_PLUGIN_PATH=%ROOT%lib\metavision\hal\plugins"
          "%ROOT%bin\metavision_viewer.exe" %*
          EOF
          echo "---- dist tree ----"
          find dist -maxdepth 4 -not -path "*/include/*" | sort | head -150

      - name: Smoke test
        shell: cmd
        run: |
          dist\bin\metavision_viewer.exe --help
          if not exist dist\lib\metavision\hal\plugins echo WARNING: plugin folder not found at expected path

      - name: Package
        shell: bash
        run: |
          rm -rf dist/include dist/share/cmake
          7z a -tzip metavision_viewer_win64.zip ./dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: metavision_viewer_win64
          path: metavision_viewer_win64.zip
